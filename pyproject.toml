[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scanmd"
version = "0.1.0"
description = "Aggregate files into a single markdown document"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[project.scripts]
scanmd = "scanmd.cli:main"

[tool.setuptools]
packages = ["scanmd"]

[tool.setuptools.package-data]
"scanmd" = ["languages.json"]
